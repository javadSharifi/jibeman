name: Build & Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Version tag (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-android:
    name: Build & Release Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine Version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.1.0")
          fi

          VERSION="${TAG#v}"
          if [ -z "$VERSION" ]; then
            VERSION="0.1.0"
          fi

          COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo 1)

          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$COMMIT_COUNT" >> $GITHUB_ENV
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "Resolved version: $VERSION (versionCode: $COMMIT_COUNT)"

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Loading release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
          elif [ ! -f "app/release.keystore" ]; then
            echo "Generating release keystore on runner..."
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias jibeman \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "jibeman123456" \
              -keypass "jibeman123456" \
              -dname "CN=Jibeman, OU=Finance, O=Jibeman, L=Tehran, ST=Tehran, C=IR"
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'jibeman123456' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'jibeman' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'jibeman123456' }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PversionName="${{ env.VERSION_NAME }}" \
            -PversionCode="${{ env.VERSION_CODE }}"

      - name: Prepare APK for Release
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          TARGET_NAME="jibeman-v${{ env.VERSION_NAME }}.apk"
          cp "$APK_PATH" "$TARGET_NAME"
          echo "Prepared APK: $TARGET_NAME"

      - name: Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: jibeman-v${{ env.VERSION_NAME }}.apk
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ github.event.release.name || format('Release {0}', env.TAG_NAME) }}
          generate_release_notes: true
